worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Define upstreams
    upstream aegis_frontend {
        server aegis_frontend:8080;
    }

    # If the host is running Sentinel UI on 3000 and Nexus on 5173, we route to host.docker.internal
    upstream sentinel_frontend {
        server sentinel_frontend:3000;
    }

    upstream nexus_frontend {
        server nexus_frontend:5173;
    }

    upstream sentinel_api {
        server api:8000;
    }

    server {
        listen       80;
        server_name  localhost;

        # Proxy to the Sentinel Next.js app (which serves as the Enterprise Hub & Login)
        location / {
            proxy_pass http://sentinel_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Authentication Endpoint
        location = /auth {
            internal;
            proxy_pass http://sentinel_api/api/verify_token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        # Error page for unauthorized access
        error_page 401 = @error401;
        location @error401 {
            return 302 /#login;
        }

        # API Proxy
        location /api/ {
            proxy_pass http://sentinel_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }



        # Proxy /aegis to the Aegis UI
        location /aegis/ {
            auth_request /auth;
            proxy_pass http://aegis_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy /nexus to the Nexus Vite app
        location /nexus/ {
            auth_request /auth;
            proxy_pass http://nexus_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
