<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis AI - Threat Response</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .chat-container { background-color: #1e293b; border-radius: 12px; width: 100%; max-width: 800px; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        h1 { margin-top: 0; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #94a3b8; }
        input, textarea { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #334155; background-color: #0f172a; color: white; font-family: inherit; box-sizing: border-box; }
        button { background-color: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0284c7; color: white; }
        .response-box { margin-top: 2rem; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 1.5rem; min-height: 100px; white-space: pre-wrap; display: none; line-height: 1.6; }
        .loading { color: #38bdf8; font-style: italic; display: none; margin-top: 1rem; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h1>🛡️ Aegis AI - Threat Response</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">Submit a vulnerability finding below to generate a contextual remediation plan using RAG and Ollama.</p>

        <form id="analyzeForm">
            <div class="form-group">
                <label for="target">Target / Asset</label>
                <input type="text" id="target" placeholder="e.g. example.com or 192.168.1.100" required>
            </div>
            <div class="form-group">
                <label for="vulnId">Vulnerability ID (CVE)</label>
                <input type="text" id="vulnId" placeholder="e.g. CVE-2024-1234" required>
            </div>
            <div class="form-group">
                <label for="desc">Finding Description</label>
                <textarea id="desc" rows="4" placeholder="Describe the finding or open port details..." required></textarea>
            </div>
            <button type="submit">Analyze Threat</button>
            <span id="loading" class="loading">Aegis is analyzing the threat landscape...</span>
        </form>

        <div id="responseBox" class="response-box"></div>
    </div>

    <script>
        document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const target = document.getElementById('target').value;
            const vulnId = document.getElementById('vulnId').value;
            const desc = document.getElementById('desc').value;
            
            const btn = e.target.querySelector('button');
            const loading = document.getElementById('loading');
            const responseBox = document.getElementById('responseBox');
            
            btn.disabled = true;
            loading.style.display = 'inline-block';
            responseBox.style.display = 'none';
            responseBox.innerHTML = '';

            try {
                const res = await fetch('http://localhost:8090/analyze/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target, vulnerability_id: vulnId, description: desc })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || `Server error ${res.status}`);
                }

                const data = await res.json();
                responseBox.textContent = data.remediation_plan;
                responseBox.style.display = 'block';
                
            } catch (error) {
                responseBox.textContent = `Error: ${error.message}`;
                responseBox.style.color = '#ef4444';
                responseBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });
    </script>

</body>
</html>
