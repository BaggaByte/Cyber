# backend/engine/tools_registry.yaml
# Each tool has: description, base_command, and a parameters schema.
# The AI orchestrator uses the descriptions to choose tools and generate args.
# The GenericBinaryPlugin validates args against the schema before execution.

tools:
  # ── Recon & Asset Mapping ──────────────────────────────────────────────────
  nmap:
    description: "Network port scanner. Discovers open ports, running services, and OS fingerprints."
    base_command: "nmap -T{speed} -p {ports} {extra_flags} {target}"
    parameters:
      speed:
        type: "integer"
        description: "Scan aggressiveness (0=paranoid/stealth, 3=default, 5=insane/fastest)"
        default: 4
        min: 0
        max: 5
      ports:
        type: "string"
        description: "Port range to scan (e.g. '80,443', '1-1000', '1-65535')"
        default: "1-1000"
        allowed_pattern: "^[0-9,\\-]+$"
      extra_flags:
        type: "string"
        description: "Additional nmap flags (e.g. '-sV' for version detection, '-sU' for UDP)"
        default: "-sV"
        allowed_values: ["-sV", "-sU", "-sV -sU", "-A", "-O", ""]

  masscan:
    description: "High-speed port scanner. Capable of scanning the full internet. Use for wide port discovery."
    base_command: "masscan -p{ports} --rate {rate} {target}"
    parameters:
      ports:
        type: "string"
        description: "Port range (e.g. '1-65535', '80,443,8080')"
        default: "1-1000"
        allowed_pattern: "^[0-9,\\-]+$"
      rate:
        type: "integer"
        description: "Packets per second (100=safe/slow, 10000=fast)"
        default: 1000
        min: 100
        max: 50000

  httpx:
    description: "HTTP probing tool (ProjectDiscovery). Identifies live web servers, status codes, titles, and technologies."
    base_command: "pd-httpx -u {target} {extra_flags} -json"
    parameters:
      extra_flags:
        type: "string"
        description: "Additional probing flags"
        default: "-title -tech-detect -status-code"
        allowed_values: ["-title -tech-detect -status-code", "-title -status-code", ""]


  # ── Subdomain Enumeration ──────────────────────────────────────────────────
  amass:
    description: "Comprehensive subdomain enumeration using passive and active DNS techniques."
    base_command: "amass enum -{mode} -d {target}"
    parameters:
      mode:
        type: "string"
        description: "Enumeration mode: 'passive' (safe/quiet) or 'active' (aggressive)"
        default: "passive"
        allowed_values: ["passive", "active"]

  sublist3r:
    description: "Fast subdomain enumeration using search engines."
    base_command: "sublist3r -d {target} -t {threads}"
    parameters:
      threads:
        type: "integer"
        description: "Number of threads (1-50)"
        default: 10
        min: 1
        max: 50

  # ── Vulnerability Scanning ─────────────────────────────────────────────────
  nuclei:
    description: "Template-based vulnerability scanner. Detects CVEs, misconfigs, and exposures."
    base_command: "nuclei -u {target} -severity {severity} -jsonl -ot"
    parameters:
      severity:
        type: "string"
        description: "Minimum severity to report (info,low,medium,high,critical)"
        default: "medium"
        allowed_values: ["info", "low", "medium", "high", "critical"]


  nikto:
    description: "Web server vulnerability scanner. Checks for dangerous files, outdated software, misconfigs."
    base_command: "nikto -h {target} -Tuning {tuning} -Format json"
    parameters:
      tuning:
        type: "string"
        description: "Scan tuning (1=interesting files, 2=misconfig, 4=XSS, 9=SQL injection)"
        default: "1,2,4"
        allowed_pattern: "^[0-9,]+$"

  trivy:
    description: "Container and filesystem vulnerability scanner. Detects CVEs in container images."
    base_command: "trivy image {target} --format json --severity {severity}"
    parameters:
      severity:
        type: "string"
        description: "Severity filter"
        default: "HIGH,CRITICAL"
        allowed_values: ["LOW,MEDIUM,HIGH,CRITICAL", "HIGH,CRITICAL", "CRITICAL"]

  grype:
    description: "Software composition analysis. Finds vulnerabilities in container images and packages."
    base_command: "grype {target} -o json --fail-on {fail_on}"
    parameters:
      fail_on:
        type: "string"
        description: "Severity at which to return a non-zero exit code"
        default: "high"
        allowed_values: ["negligible", "low", "medium", "high", "critical"]

  # ── Web Fuzzing ────────────────────────────────────────────────────────────
  ffuf:
    description: "Web fuzzer for directory/file discovery. Finds hidden endpoints and admin panels."
    base_command: "ffuf -u http://{target}/FUZZ -w {wordlist} -mc {match_codes} -json -noninteractive -s"
    parameters:
      wordlist:
        type: "string"
        description: "Path to wordlist file"
        default: "/usr/share/wordlists/dirb/common.txt"
        allowed_values:
          - "/usr/share/wordlists/dirb/common.txt"
          - "/usr/share/wordlists/dirb/big.txt"
          - "/usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt"
      match_codes:
        type: "string"
        description: "HTTP status codes to match"
        default: "200,301,302,403"
        allowed_pattern: "^[0-9,\\-]+$"

  gobuster:
    description: "Directory and file brute-forcer for web servers."
    base_command: "gobuster dir -u http://{target} -w {wordlist} -s {status_codes} -q"
    parameters:
      wordlist:
        type: "string"
        description: "Path to wordlist"
        default: "/usr/share/wordlists/dirb/common.txt"
        allowed_values:
          - "/usr/share/wordlists/dirb/common.txt"
          - "/usr/share/wordlists/dirb/big.txt"
      status_codes:
        type: "string"
        description: "Comma-separated HTTP status codes to show"
        default: "200,301,302,307,401,403"
        allowed_pattern: "^[0-9,]+$"

  # ── Advanced Penetration Testing ───────────────────────────────────────────
  sqlmap:
    description: "Automatic SQL injection and database takeover tool."
    base_command: "sqlmap -u {target} --batch --random-agent --level={level} --risk={risk}"
    parameters:
      level:
        type: "integer"
        description: "Level of tests to perform (1-5)"
        default: 1
        min: 1
        max: 5
      risk:
        type: "integer"
        description: "Risk of tests to perform (1-3)"
        default: 1
        min: 1
        max: 3

  wpscan:
    description: "WordPress vulnerability scanner."
    base_command: "wpscan --url {target} --no-update --format json --enumerate {enumerate}"
    parameters:
      enumerate:
        type: "string"
        description: "Enumeration options (e.g., vp,vt,tt,u)"
        default: "vp,vt,tt,u"
        allowed_values: ["vp,vt,tt,u", "vp,vt", "u", ""]

  zap:
    description: "OWASP ZAP web vulnerability scanner (CLI)."
    base_command: "zap -cmd -quickurl {target} -quickout /tmp/zap_report.json"
    parameters: {}

